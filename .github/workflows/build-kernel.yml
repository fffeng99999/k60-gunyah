name: build-k60-kernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-k60-kernel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      KERNEL_REPO: https://github.com/crdroidandroid/android_kernel_xiaomi_sm8450.git
      KERNEL_COMMIT: 38c6baf4bb72f783bb3588f9f1240603632a6c83
      TARGET_RELEASE: 5.10.252-gki-g19f54b03cc87

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc binutils bison ca-certificates ccache cpio curl device-tree-compiler \
            file flex gpg kmod libelf-dev libssl-dev make python3 rsync unzip wget \
            xz-utils zip
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/apt.llvm.org.gpg
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-22 lld-22 llvm-22
          sudo mkdir -p /opt/llvm22/bin
          for f in /usr/lib/llvm-22/bin/*; do
            sudo ln -sf "$f" "/opt/llvm22/bin/$(basename "$f")"
          done
          echo /opt/llvm22/bin >> "$GITHUB_PATH"
          /opt/llvm22/bin/clang --version

      - name: Fetch exact kernel source
        run: |
          set -euxo pipefail
          mkdir -p .work/kernel
          git -C .work/kernel init
          git -C .work/kernel remote add origin "$KERNEL_REPO"
          git -C .work/kernel fetch --depth 1 origin "$KERNEL_COMMIT"
          git -C .work/kernel checkout --detach FETCH_HEAD
          grep -q '^SUBLEVEL = 252$' .work/kernel/Makefile
          git -C .work/kernel show -s --format='%H %s'
          rm -rf .work/kernel/.git

      - name: Build arm64 Image
        run: |
          set -euxo pipefail
          chmod +x scripts/build_kernel.sh
          KERNEL_SRC="$PWD/.work/kernel" OUT_DIR="$PWD/out/kernel" \
            ./scripts/build_kernel.sh

      - name: Verify Image
        run: |
          set -euxo pipefail
          file out/kernel/Image
          strings out/kernel/Image | grep -m 1 'Linux version 5.10.252-gki-g19f54b03cc87'
          test -s out/kernel/System.map
          test -s out/kernel/kernel.config
          sha256sum out/kernel/Image out/kernel/System.map

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: k60-kernel-${{ github.sha }}
          path: |
            out/kernel/Image
            out/kernel/System.map
            out/kernel/kernel.config
            out/kernel/Module.symvers
          if-no-files-found: error
          retention-days: 14
