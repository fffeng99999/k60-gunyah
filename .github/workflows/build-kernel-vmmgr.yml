name: build-k60-kernel-vmmgr

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-k60-kernel-vmmgr
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      KERNEL_REPO: https://github.com/crdroidandroid/android_kernel_xiaomi_sm8450.git
      KERNEL_COMMIT: 38c6baf4bb72f783bb3588f9f1240603632a6c83
      TARGET_RELEASE: 5.10.252-gki-g19f54b03cc87

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc binutils bison ca-certificates ccache cpio curl device-tree-compiler \
            file flex gpg kmod libelf-dev libssl-dev make python3 rsync unzip wget \
            xz-utils zip
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/apt.llvm.org.gpg
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-22 lld-22 llvm-22
          # Needed by scripts/precompile_check.ps1
          sudo apt-get install -y --no-install-recommends powershell
          sudo mkdir -p /opt/llvm22/bin
          for f in /usr/lib/llvm-22/bin/*; do
            sudo ln -sf "$f" "/opt/llvm22/bin/$(basename "$f")"
          done
          echo /opt/llvm22/bin >> "$GITHUB_PATH"
          /opt/llvm22/bin/clang --version

      - name: Fetch exact kernel source
        run: |
          set -euxo pipefail
          mkdir -p .work/kernel
          git -C .work/kernel init
          git -C .work/kernel remote add origin "$KERNEL_REPO"
          git -C .work/kernel fetch --depth 1 origin "$KERNEL_COMMIT"
          git -C .work/kernel checkout --detach FETCH_HEAD
          grep -q '^SUBLEVEL = 252$' .work/kernel/Makefile
          git -C .work/kernel show -s --format='%H %s'
          # Prevent setlocalversion from appending "+" for a dirty tree.
          rm -rf .work/kernel/.git

      # Cheap gate first: a full kernel build is ~25 minutes, so run the
      # static check and fail in seconds instead.
      - name: Pre-compile static check
        run: |
          set -euxo pipefail
          pwsh -NoProfile -File scripts/precompile_check.ps1

      - name: Apply in-tree VM manager
        run: |
          set -euxo pipefail
          chmod +x scripts/apply_intree.sh scripts/build_kernel.sh
          KERNEL_SRC="$PWD/.work/kernel" ./scripts/apply_intree.sh
          grep -n 'GH_VM_MGR' .work/kernel/drivers/virt/gunyah/Kconfig
          grep -n 'GH_VM_MGR' .work/kernel/drivers/virt/gunyah/Makefile
          ls -l .work/kernel/drivers/virt/gunyah/vm_mgr.c

      - name: Build arm64 Image with VM manager
        run: |
          set -euxo pipefail
          KERNEL_SRC="$PWD/.work/kernel" OUT_DIR="$PWD/out/kernel" \
            ./scripts/build_kernel.sh

      - name: Verify Image, config and modules
        run: |
          set -euxo pipefail
          file out/kernel/Image
          strings out/kernel/Image | grep -m1 'Linux version 5.10.252-gki-g19f54b03cc87'
          test -s out/kernel/Image
          test -s out/kernel/System.map
          test -s out/kernel/kernel.config

          # GH_VM_MGR is =m: it depends on GH_RM_DRV, which the device
          # config sets to =m, so =y is not reachable without dropping the
          # vendor gh_rm_drv.ko that DRM, qrtr and the virtio backends load.
          grep -E '^CONFIG_GH_VM_MGR=m$' out/kernel/kernel.config
          grep -E '^CONFIG_GH_RM_DRV=m$' out/kernel/kernel.config

          # The VM manager module must carry the device vermagic.
          test -s out/kernel/modules/gh_vm_mgr.ko
          test "$(modinfo -F vermagic out/kernel/modules/gh_vm_mgr.ko)" = \
            "5.10.252-gki-g19f54b03cc87 SMP preempt mod_unload modversions aarch64"
          strings out/kernel/modules/gh_vm_mgr.ko | grep -m1 'Gunyah VM manager loaded'

          # gh_rm_drv must now carry the RM extensions, and must still be =m
          # so the vendor module is replaced by an equivalent, not removed.
          test -s out/kernel/modules/gh_rm_drv.ko
          strings out/kernel/modules/gh_rm_drv.ko | grep -m1 'gh_rm_vmmgr'

          sha256sum out/kernel/Image out/kernel/System.map \
            out/kernel/modules/*.ko

      - name: Cross-compile userspace probe
        run: |
          set -euxo pipefail
          command -v aarch64-linux-gnu-gcc || \
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          # Syntax and ABI check only. The real build happens on device, or
          # with a static musl toolchain, because glibc on CI is not what
          # Android ships.
          aarch64-linux-gnu-gcc -std=gnu11 -Wall -Wextra -O2 \
            -o out/vmmgr_probe scripts/vmmgr_probe.c
          file out/vmmgr_probe

      # The stock boot.img is not committed (it is a firmware image), so the
      # repack runs on the workstation after downloading the Image. See
      # KERNEL_BUILD.md section 6.
      - name: Pack boot.img (skipped, needs stock boot_a.img)
        run: |
          set -euxo pipefail
          if [[ -f "$PWD/boot_a.img" ]]; then
            python3 scripts/repack_boot_v4.py \
              --stock-boot "$PWD/boot_a.img" \
              --kernel "$PWD/out/kernel/Image" \
              --output "$PWD/out/boot_vmmgr.img"
            ls -l out/boot_vmmgr.img
          else
            echo "boot_a.img absent; skip repack. Run locally:"
            echo "  python3 scripts/repack_boot_v4.py --stock-boot <boot_a.img> \\"
            echo "    --kernel out/kernel/Image --output out/boot_vmmgr.img"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k60-kernel-vmmgr-${{ github.sha }}
          path: |
            out/kernel/Image
            out/kernel/System.map
            out/kernel/kernel.config
            out/kernel/vmlinux.symvers
            out/kernel/modules/gh_vm_mgr.ko
            out/kernel/modules/gh_rm_drv.ko
            out/boot_vmmgr.img
            out/vmmgr_probe
          if-no-files-found: error
          retention-days: 30
